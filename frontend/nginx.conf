# Render принимает внешний HTTPS-запрос и передаёт его контейнеру по внутреннему HTTP
# Исходный протокол приходит в заголовке X-Forwarded-Proto
# Если заголовка нет, например при локальном запуске, используется протокол текущего запроса
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Непривилегированный пользователь nginx не может открывать системные порты ниже 1024
    # Первая директива принимает IPv4-соединения, вторая — IPv6-соединения
    listen 8080;
    listen [::]:8080;

    # Символ _ используется как универсальное имя для запросов с любым доменом
    # Фактический публичный домен и HTTPS настраиваются на стороне Render
    server_name _;

    # В эту директорию Dockerfile копирует готовую production-сборку Compose Web
    # Файл index.html используется как начальная страница приложения
    root /usr/share/nginx/html;
    index index.html;

    # Запрещает браузеру определять тип содержимого самостоятельно вопреки Content-Type
    # Это снижает риск выполнения файла в непредусмотренном формате
    add_header X-Content-Type-Options "nosniff" always;

    # Разрешает встраивать приложение во frame только страницам с того же origin
    # Это снижает риск атак с подменой интерфейса через сторонний сайт
    add_header X-Frame-Options "SAMEORIGIN" always;

    # При переходе на другой origin передаёт только адрес сайта без полного пути запроса
    # Для запросов внутри одного origin сохраняет полную информацию Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Знак = требует точного совпадения с путём /health
    # Endpoint не зависит от файлов frontend и доступности backend
    # Его можно указать в Render как Health Check Path для frontend-сервиса
    location = /health {
        # Регулярные проверки состояния не записываются в журнал доступа
        access_log off;

        # Проверка всегда возвращает простой текст и успешный HTTP-статус
        default_type text/plain;
        return 200 "ok\n";
    }

    # Все запросы с префиксом /api/v1/ перенаправляются в Spring Boot backend
    # Браузер обращается к API через домен frontend, поэтому запрос остаётся same-origin
    # Настройка CORS для такого способа обращения не требуется
    location /api/v1/ {
        # BACKEND_URL задаётся в переменных окружения frontend-сервиса на Render
        # Docker entrypoint подставляет значение в шаблон при запуске контейнера
        # Адрес указывается без завершающего слеша, например https://backend.onrender.com
        # Путь и параметры исходного запроса сохраняются при проксировании
        proxy_pass ${BACKEND_URL}/api/v1/;

        # HTTP/1.1 используется для стабильной работы постоянных соединений с backend
        proxy_http_version 1.1;

        # Передаёт публичное имя backend вместо домена frontend
        # Маршрутизатор Render использует этот заголовок для выбора нужного сервиса
        proxy_set_header Host $proxy_host;

        # Передаёт адрес узла, который непосредственно подключился к Nginx
        proxy_set_header X-Real-IP $remote_addr;

        # Добавляет текущий адрес к существующей цепочке прокси
        # Backend сможет определить маршрут запроса через инфраструктуру Render и Nginx
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Передаёт исходный внешний протокол, обычно https на Render
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Передаёт имя backend во время TLS-соединения
        # SNI позволяет Render выбрать правильный сертификат среди нескольких доменов
        proxy_ssl_server_name on;

        # Ограничивает ожидание установки соединения с backend
        proxy_connect_timeout 15s;

        # Ограничивает ожидание следующей части ответа backend
        proxy_read_timeout 90s;
    }

    # Сначала Nginx пытается найти запрошенный файл или директорию
    # Если ресурса нет, возвращается index.html, а маршрут обрабатывает Compose Web
    # Это предотвращает ошибку 404 при обновлении страницы на клиентском маршруте
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Включает сжатие ответов для уменьшения объёма загружаемых ресурсов
    gzip on;

    # Добавляет заголовок Vary: Accept-Encoding для корректной работы промежуточных кэшей
    gzip_vary on;

    # Не тратит ресурсы процессора на сжатие файлов меньше одного килобайта
    gzip_min_length 1024;

    # Сжимает основные форматы, используемые Compose Web
    gzip_types application/javascript application/wasm image/svg+xml text/css;
}
