map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Непривилегированный процесс Nginx использует порт выше 1024
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Базовые защитные заголовки для статического приложения
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Служебный endpoint используется healthcheck контейнера
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Браузер обращается к API через Nginx по тому же origin, поэтому CORS не требуется
    # Адрес независимо развёрнутого публичного backend задаётся переменной BACKEND_URL
    location /api/v1/ {
        proxy_pass ${BACKEND_URL}/api/v1/;
        proxy_http_version 1.1;

        # Публичный маршрутизатор Render определяет backend по имени его хоста
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # SNI необходим при обращении к backend по публичному HTTPS-адресу Render
        proxy_ssl_server_name on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Compose Web загружается как одностраничное приложение
    # Неизвестные пути возвращают index.html для клиентской навигации
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Сжатие особенно полезно для крупных JS-файлов production-сборки
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm image/svg+xml text/css;
}
