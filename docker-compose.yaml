services:
  postgres:
    image: postgres:16
    container_name: daily-planner-postgres
    restart: "no"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/db.migration/V1__create_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres-data:
