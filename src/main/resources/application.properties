spring.config.import=optional:file:.env[.properties]

spring.application.name=DailyPlannerBackend
server.port=${PORT:8080}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:daily_planner}}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}
